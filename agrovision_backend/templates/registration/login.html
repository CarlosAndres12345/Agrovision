{% extends 'base.html' %}

{% block title %}Iniciar sesión | Agrovision{% endblock %}

{% block content %}
<section class="card">
    <h1>Iniciar sesión</h1>
    {% if form.errors %}
        <p class="empty">Por favor ingrese nombre de usuario y contraseña correctos.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Iniciar sesión</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</section>
{% endblock %}
